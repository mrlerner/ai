<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=816">
<title>Crosswalk flyer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* One letter-size page (816 × 1056 px at 96 dpi). Embedded scaled down on corner pages; prints at full size. */
@page { size: Letter; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { width: 8.5in; height: 11in; overflow: hidden; font-family: "Public Sans", Arial, sans-serif; color: #1d2320;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { position: relative; height: 11in; padding: 0.4in 0.5in 0.34in; display: flex; flex-direction: column; gap: 0.14in; }
.top { display: flex; justify-content: space-between; align-items: center; }
.brand { background: #1f5f3a; color: #fff; border: 3px solid #fff; outline: 3px solid #1f5f3a; border-radius: 8px; padding: 6px 14px 4px; font: 800 20px/1.05 Overpass, Arial, sans-serif; }
.brand small { display: block; font: 600 10px Overpass, Arial; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.law { font: 600 11px/1.35 "Public Sans"; color: #5d6660; max-width: 3.1in; text-align: right; }
h1 { font: 900 42px/1 Overpass, Arial, sans-serif; margin: 0.04in 0 0; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #c8261d; }
.plate { align-self: flex-start; background: #1f5f3a; color: #fff; border-radius: 10px; padding: 9px 18px 6px; border: 4px solid #fff; outline: 4px solid #1f5f3a; font: 800 30px/1.1 Overpass, Arial, sans-serif; }
.risk { display: grid; grid-template-columns: 2.05in 1fr; gap: 0.25in; border: 3px solid #c8261d; border-radius: 14px; padding: 12px 18px; }
.risk.mid { border-color: #c86a00; }
.score { text-align: center; align-self: center; }
.score .k { font: 800 13px Overpass, Arial; letter-spacing: .12em; text-transform: uppercase; color: #3c4540; }
.score .v { font: 900 100px/.92 Overpass, Arial; color: #c8261d; margin-top: 6px; }
.risk.mid .score .v { color: #c86a00; }
.score .of { font: 700 15px "Public Sans"; color: #3c4540; }
.score .lbl { display: inline-block; margin-top: 10px; background: #c8261d; color: #fff; border-radius: 99px; padding: 5px 14px 3px; font: 800 17px Overpass, Arial; }
.risk.mid .score .lbl { background: #c86a00; }
.why h2 { font: 800 23px/1.1 Overpass, Arial; margin: 2px 0 8px; }
.why ul { margin: 0; padding: 0; list-style: none; }
.why li { position: relative; padding-left: 22px; margin-bottom: 5px; font-size: 15px; line-height: 1.35; color: #3c4540; }
.why li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 9px; height: 9px; border-radius: 2px; background: #c8261d; }
.why li b { color: #1d2320; }
.urgent { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.u { background: #f4f2ed; border-radius: 10px; padding: 10px 14px; }
.u b { display: block; font: 900 26px/1.05 Overpass, Arial; color: #1d2320; }
.u b.plan { color: #b26a00; }
.u span { font-size: 13.5px; line-height: 1.3; color: #3c4540; }
.act { display: grid; grid-template-columns: 1fr 2.6in; gap: 0.25in; align-items: start; flex: 1; }
.steps h2 { font: 800 25px/1.1 Overpass, Arial; margin: 0 0 12px; }
.step { display: grid; grid-template-columns: 46px 1fr; gap: 12px; margin-bottom: 9px; align-items: start; }
.n { width: 46px; height: 46px; border-radius: 50%; color: #fff; font: 900 24px/46px Overpass, Arial; text-align: center; background: #1f5f3a; }
.step h3 { font: 800 20px/1.15 Overpass, Arial; margin: 2px 0 2px; }
.step p { margin: 0; font-size: 14px; line-height: 1.4; color: #3c4540; }
.qr { border: 3px solid #1d2320; border-radius: 14px; padding: 12px 14px; text-align: center; }
.qr .scan { font: 900 23px/1.05 Overpass, Arial; margin-bottom: 8px; }
.qr svg { width: 100%; height: auto; display: block; }
.qr p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.35; color: #3c4540; }
.foot { align-items: flex-end; border-top: 2px solid #1d2320; padding-top: 8px; display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; line-height: 1.35; color: #5d6660; }
.foot b { color: #1d2320; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const titleCase = s => s.toLowerCase().replace(/\b(ne|n|nw|se|sw|s|e|w)\b/g, m => m.toUpperCase())
  .replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bAnd\b/g, "and").replace(/(\d+)(St|Nd|Rd|Th)\b/g, (m, n, s) => n + s.toLowerCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const site = new URL("seattle-crosswalks.html", location.href).href;

const riskLabel = s => s >= 90 ? "Highest risk" : s >= 70 ? "Very risky" : s >= 50 ? "Somewhat risky" : "Lower risk";
const ft = m => `${(Math.round(m / 0.3048 / 50) * 50).toLocaleString()} feet`;
// Plain reasons this corner is dangerous to cross, worst first. Only things that make the case; no citywide rankings.
function reasons(c) {
  const out = [], [n, ser, fat, recent] = c.cx;
  if (n) out.push(`<b>${n} pedestrian crash${n > 1 ? "es" : ""}</b> at or next to this corner since 2016${fat ? `, <b>${fat} fatal</b>` : ""}${ser ? `, ${ser} with serious injuries` : ""}.`);
  const road = c.ac === 1 ? "a main arterial" : c.ac === 2 ? "an arterial" : "";
  if (c.ln >= 3) out.push(`<b>${c.ln} lanes of traffic</b> to cross${road ? ` on ${road}` : ""}.`);
  else if (road) out.push(`Traffic on <b>${road}</b>, with nothing telling drivers to stop.`);
  if (c.gap == null) out.push(`<b>No marked crosswalk</b> on either street.`);
  else if (c.gap >= 800) out.push(`<b>No marked crosswalk within half a mile.</b>`);
  else if (c.gap >= 150) out.push(`The nearest marked crosswalk is <b>${ft(c.gap)} away</b>, so people cross here anyway.`);
  const to = [c.sch >= 2 && "schools", c.tr >= 2 && "bus stops", c.pk >= 2 && "a park"].filter(Boolean);
  if (to.length) out.push(`People cross here to reach <b>${to.join(to.length > 2 ? ", " : " and ").replace(/, ([^,]*)$/, ", and $1")}</b>.`);
  out.push(`<b>SDOT already lists it</b> as a corner that needs a better crossing.`);
  return out.slice(0, 5);
}

function render(D) {
  const slug = decodeURIComponent(location.hash.slice(1));
  const c = D.corners.find(x => x.s === slug);
  if (!c) { document.getElementById("page").innerHTML = "<p>Corner not found.</p>"; return; }
  const h = D.hoods[c.h];
  // The QR code opens the corner page at the pre-written email to SDOT.
  const url = `${site}#c-${c.s}/city`;
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  const scheduled = c.pl && c.pl[1] !== "waiting";
  const m = c.m[3], recent = c.cx[3];
  const wait = scheduled ? ["Scheduled", "SDOT has a work order open. Emails help keep it from slipping.", "plan"]
    : m <= 2 ? ["About a year", "estimated wait for the city to build one at its current pace"]
    : m <= 10 ? [`About ${Math.round(m)} years`, "estimated wait for the city to build one at its current pace"]
    : m <= 20 ? ["10+ years", "estimated wait for the city to build one at its current pace"]
    : ["20+ years", "estimated wait for the city to build one at its current pace"];
  const second = recent ? [`${recent} since 2021`, `of those crashes happened in the last five years. It's still happening.`]
    : [`${c.v} neighbors`, "have already said they want a crosswalk here"];
  document.title = `Crosswalk flyer · ${titleCase(c.w)}`;
  document.getElementById("page").innerHTML = `
    <div class="top">
      <div class="brand"><small>${esc(h.name)} · Seattle</small>Crosswalk Watch</div>
      <div class="law">In Washington, every intersection is a legal crosswalk, marked or not. Drivers must stop for people crossing.</div>
    </div>
    <h1>This corner is dangerous to cross.<br><em>It needs a crosswalk.</em></h1>
    <div class="plate">${esc(titleCase(c.w))}</div>
    <div class="risk${c.rs < 70 ? " mid" : ""}">
      <div class="score"><div class="k">Risk Score</div><div class="v">${c.rs}</div><div class="of">out of 100</div><div class="lbl">${riskLabel(c.rs)}</div></div>
      <div class="why"><h2>Why it's dangerous</h2><ul>${reasons(c).map(r => `<li>${r}</li>`).join("")}</ul></div>
    </div>
    <div class="urgent">
      <div class="u"><b class="${wait[2] || ""}">${wait[0]}</b><span>${wait[1]}</span></div>
      <div class="u"><b>${second[0]}</b><span>${second[1]}</span></div>
    </div>
    <div class="act">
      <div class="steps">
        <h2>Send the city one email. It takes 2 minutes.</h2>
        <div class="step"><div class="n">1</div><div><h3>Scan the code</h3><p>It opens an email to SDOT that's already written, with the facts about this corner that SDOT looks at.</p></div></div>
        <div class="step"><div class="n">2</div><div><h3>Add your name and send</h3><p>Copy your council member too. Their office can ask SDOT for an answer.</p></div></div>
        <div class="step"><div class="n">3</div><div><h3>Get 5 neighbors to send one</h3><p>The city pays attention when several neighbors write about the same corner. The page has a message you can forward.</p></div></div>
      </div>
      <div class="qr">
        <div class="scan">Scan to email the city</div>
        ${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}
        <p>The email is already written. Just add your name.</p>
      </div>
    </div>
    <div class="foot">
      <div><b>Posted by a neighbor.</b> Please leave this up for two weeks.<br>No phone? Visit <b>${esc(site.replace(/^https?:\/\//, ""))}</b></div>
      <div>Risk Score: pedestrian crashes, lanes of traffic and distance to the nearest crosswalk.<br>Data: SDOT priority crossings, Marked Crosswalks and collision records.</div>
    </div>`;
}
fetch("seattle-crosswalks-data.json?v=1793219695").then(r => r.json()).then(D => { render(D); window.addEventListener("hashchange", () => render(D)); });
</script>
</body>
</html>
