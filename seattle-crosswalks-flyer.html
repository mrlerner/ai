<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=816">
<title>Crosswalk flyer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* One letter-size page (816 × 1056 px at 96 dpi). Embedded scaled down on corner pages; prints at full size. */
@page { size: Letter; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { width: 8.5in; height: 11in; overflow: hidden; font-family: "Public Sans", Arial, sans-serif; color: #1d2320;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { position: relative; height: 11in; padding: 0.42in 0.5in 0.36in; display: flex; flex-direction: column; gap: 0.17in; }
.top { display: flex; justify-content: space-between; align-items: center; }
.brand { background: #1f5f3a; color: #fff; border: 3px solid #fff; outline: 3px solid #1f5f3a; border-radius: 8px; padding: 6px 14px 4px; font: 800 20px/1.05 Overpass, Arial, sans-serif; }
.brand small { display: block; font: 600 10px Overpass, Arial; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.law { font: 600 11px/1.35 "Public Sans"; color: #5d6660; max-width: 3.1in; text-align: right; }
h1 { font: 900 54px/0.98 Overpass, Arial, sans-serif; margin: 0.05in 0 0; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #c8261d; }
.plate { align-self: flex-start; background: #1f5f3a; color: #fff; border-radius: 10px; padding: 12px 20px 9px; border: 4px solid #fff; outline: 4px solid #1f5f3a; font: 800 34px/1.1 Overpass, Arial, sans-serif; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fact { border: 2px solid #d9ddd6; border-radius: 10px; padding: 10px 12px; }
.fact b { display: block; font: 900 30px/1.05 Overpass, Arial; color: #c8261d; }
.fact b.plan { color: #b26a00; }
.fact span { font-size: 13.5px; line-height: 1.3; color: #3c4540; }
.mid { display: grid; grid-template-columns: 1fr 2.85in; gap: 0.25in; align-items: start; flex: 1; }
.steps h2 { font: 800 25px/1.12 Overpass, Arial; margin: 0 0 12px; }
.step { display: grid; grid-template-columns: 52px 1fr; gap: 14px; margin-bottom: 15px; align-items: start; }
.n { width: 52px; height: 52px; border-radius: 50%; color: #fff; font: 900 27px/52px Overpass, Arial; text-align: center; }
.n.a { background: #1f5f3a; } .n.b { background: #c8261d; } .n.c { background: #e8590c; }
.step h3 { font: 800 21px/1.15 Overpass, Arial; margin: 2px 0 3px; }
.step p { margin: 0; font-size: 14.5px; line-height: 1.45; color: #3c4540; }
.kit { display: grid; grid-template-columns: 1.25in 1fr; gap: 10px; align-items: center; border: 2px solid #e8590c; border-radius: 10px; padding: 8px 10px; margin-left: 66px; }
.kit img { width: 1.25in; height: 1.25in; object-fit: contain; }
.kit p { margin: 0; font-size: 13.5px; line-height: 1.35; }
.kit b { font: 800 16px Overpass, Arial; display: block; }
.qr { border: 3px solid #1d2320; border-radius: 14px; padding: 14px; text-align: center; }
.qr .scan { font: 900 26px/1.05 Overpass, Arial; margin-bottom: 8px; }
.qr svg { width: 100%; height: auto; display: block; }
.qr p { margin: 10px 0 0; font-size: 14px; line-height: 1.35; color: #3c4540; }
.foot { align-items: flex-end; border-top: 2px solid #1d2320; padding-top: 8px; display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; line-height: 1.35; color: #5d6660; }
.foot b { color: #1d2320; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const titleCase = s => s.toLowerCase().replace(/\b(ne|n|nw|se|sw|s|e|w)\b/g, m => m.toUpperCase())
  .replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bAnd\b/g, "and").replace(/(\d+)(St|Nd|Rd|Th)\b/g, (m, n, s) => n + s.toLowerCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const site = new URL("seattle-crosswalks.html", location.href).href;

function render(D) {
  const slug = decodeURIComponent(location.hash.slice(1));
  const c = D.corners.find(x => x.s === slug);
  if (!c) { document.getElementById("page").innerHTML = "<p>Corner not found.</p>"; return; }
  const h = D.hoods[c.h];
  const url = `${site}#c-${c.s}`;
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  const scheduled = c.pl && c.pl[1] !== "waiting";
  const m = c.m[3];
  const wait = scheduled ? ["Scheduled", "SDOT has a crosswalk planned here. Help keep the flags up until it's painted.", "plan"]
    : m <= 2 ? ["~1 year", "estimated wait for the city to build one", ""] : m <= 10 ? [`~${Math.round(m)} years`, "estimated wait for the city to build one", ""]
    : m <= 20 ? ["10+ years", "estimated wait for the city to build one", ""] : ["Unlikely", "that the city builds one soon at its current pace", ""];
  const gapFt = c.gap ? `${(Math.round(c.gap / 0.3048 / 10) * 10).toLocaleString()} ft` : "None";
  document.title = `Crosswalk flyer · ${titleCase(c.w)}`;
  document.getElementById("page").innerHTML = `
    <div class="top">
      <div class="brand"><small>${esc(h.name)} · Seattle</small>Crosswalk Watch</div>
      <div class="law">In Washington, every intersection is a legal crosswalk, marked or not. Drivers must stop for people crossing.</div>
    </div>
    <h1>This corner <em>needs a crosswalk.</em></h1>
    <div class="plate">${esc(titleCase(c.w))}</div>
    <div class="facts">
      <div class="fact"><b>#${c.cr.toLocaleString()}</b><span>of ${D.city_total.toLocaleString()} corners on SDOT's own list of places that need a crossing</span></div>
      <div class="fact"><b>${gapFt}</b><span>${c.gap ? "to the nearest marked crosswalk on either street" : "marked crosswalks nearby on either street"}</span></div>
      <div class="fact"><b class="${wait[2]}">${wait[0]}</b><span>${wait[1]}</span></div>
    </div>
    <div class="mid">
      <div class="steps">
        <h2>Neighbors can change that. It takes 5 minutes.</h2>
        <div class="step"><div class="n a">1</div><div><h3>Vote for this corner</h3><p>Add a note about what happens here: near-misses, who crosses, what time of day. The top corners go into the neighborhood's letter to SDOT.</p></div></div>
        <div class="step"><div class="n b">2</div><div><h3>Send the city a 2-minute email</h3><p>Emails to SDOT and to your council member are already written, with this corner's facts. Just add your name and press send.</p></div></div>
        <div class="step"><div class="n c">3</div><div><h3>Help put up crosswalk flags</h3><p>Order a flag kit for this corner, or volunteer to keep the flags stocked until the city paints a crosswalk.</p></div></div>
        <div class="kit"><img src="seattle-crosswalks-kit.jpg" alt=""><p><b>Crosswalk Watch Flag Kit</b>Two steel flag boxes with QR signs, 10 reflective flags, and clamps that fit any sign pole. No drilling.</p></div>
      </div>
      <div class="qr">
        <div class="scan">Scan to take action</div>
        ${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}
        <p>Vote, send the emails, or order flags for this corner.</p>
      </div>
    </div>
    <div class="foot">
      <div><b>Posted by a neighbor.</b> Please leave this up for two weeks.<br>No phone? Visit <b>${esc(site.replace(/^https?:\/\//, ""))}</b></div>
      <div>Data: SDOT Seattle Transportation Plan priority crossings and Marked Crosswalks.</div>
    </div>`;
}
fetch("seattle-crosswalks-data.json?v=1793206185").then(r => r.json()).then(D => { render(D); window.addEventListener("hashchange", () => render(D)); });
</script>
</body>
</html>
