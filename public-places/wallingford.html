<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallingford Encampments</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb; --card: #ffffff; --fg: #0b0b0b; --muted: #52514e; --faint: #8a8984; --line: #e4e3df; --chip: #f0efec;
  --recent: #eb6834; --earlier: #2a78d6; --bar: #9ec5f4; --bar-on: #2a78d6; --ring: #0b0b0b;
  --key-fill: #2f9e44; --edge: #3a3a38;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #1a1a19; --card: #222220; --fg: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --line: #383835; --chip: #2c2c2a;
    --recent: #d95926; --earlier: #3987e5; --bar: #1c5cab; --bar-on: #86b6ef; --ring: #f0efec;
    --key-fill: #4cc35f; --edge: #d8d7d0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --card: #222220; --fg: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --line: #383835; --chip: #2c2c2a;
  --recent: #d95926; --earlier: #3987e5; --bar: #1c5cab; --bar-on: #86b6ef; --ring: #f0efec;
  --key-fill: #4cc35f; --edge: #d8d7d0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 72px; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 34px; line-height: 1.15; margin: 4px 0 18px; }
h2 { font-size: 20px; margin: 36px 0 8px; }
.hero { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; margin-bottom: 18px; }
.hero .num { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .what { font-size: 18px; max-width: 46ch; }
.hero .then { color: var(--muted); font-size: 15px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 12px; }
select, .chip, button { font: inherit; font-size: 14px; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
select { border-radius: 8px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
#map { height: 560px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; font-size: 15px; }
.panel h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
.panel .sub { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.panel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; font-variant-numeric: tabular-nums; }
.panel .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.panel .acts a, .panel .acts button { text-align: center; text-decoration: none; border-radius: 8px; padding: 8px 12px; }
.panel .acts a.primary { background: var(--fg); color: var(--bg); border: 1px solid var(--fg); }
.panel .acts button[disabled] { opacity: .55; cursor: default; }
.months12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 4px; }
.months12 span { height: 14px; border-radius: 3px; background: var(--chip); border: 1px solid var(--line); }
.months12 span.on { background: var(--earlier); border-color: var(--earlier); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.ringed { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ring); background: var(--earlier); }
.keysw { width: 14px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--key-fill) 30%, transparent); border: 1px solid var(--key-fill); }
.edgesw { width: 18px; height: 0; border-top: 2px dashed var(--edge); vertical-align: 3px !important; }
#chart { position: relative; }
#chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
#chart .tip, .leaflet-tooltip.tip { position: absolute; pointer-events: none; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.sel { background: var(--chip); }
.notes { color: var(--muted); font-size: 14px; max-width: 75ch; }
.notes li { margin: 4px 0; }
a { color: var(--earlier); }
.leaflet-container { font: inherit; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  #map { height: 440px; }
  h1 { font-size: 28px; }
  .hero .num { font-size: 44px; }
}
</style>
</head>

<main>
  <div class="kicker">Encampment reports</div>
  <h1>Encampments in <span id="hoodname"></span></h1>

  <div class="controls">

    <select id="month" aria-label="Month"></select>
    <span class="label" style="margin-left:8px">What reporters saw</span>
    <span id="filters"></span>

  <div class="layout">
    <div>
      <div id="map" role="img" aria-label="Map of blocks with encampment reports"></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <h2>Blocks with a report, by month</h2>
  <div id="chart"></div>

  <h2 id="tableTitle">Blocks this month</h2>

    <tbody id="rows"></tbody>
  </table></div>

  <h2>About this page</h2>
  <ul class="notes" id="notes"></ul>
</main>

const FILTERS = [["all", "Anything"], ["tents", "Tents"], ["rvs", "RVs or cars"], ["sidewalk", "Blocking the sidewalk"], ["needles", "Needles"]];
const FILTER_WORDS = { all: "an encampment", tents: "tents", rvs: "RVs or cars", sidewalk: "an encampment blocking the sidewalk", needles: "needles" };
const FIND_IT = "https://www.seattle.gov/customer-service-bureau/find-it-fix-it-mobile-app";
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const monthName = (m, short) => new Date(m + "-15T12:00").toLocaleDateString("en-US", short ? { month: "short", year: "2-digit" } : { month: "long", year: "numeric" });
const dayName = d => new Date(d + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const latest = D.months[D.months.length - 1];
const recentFrom = (() => { const t = new Date(D.cutoff + "T12:00"); t.setDate(t.getDate() - 7); return t.toISOString().slice(0, 10); })();
let month = latest, filter = "all", selected = null;

// A block counts for a month and filter when it had a report that month showing what the filter asks for.
const hit = (b, m, f = filter) => { const x = b.m[m]; return x && (f === "all" ? x.n > 0 : x[f] > 0); };
const activeIn = (m, f = filter) => D.blocks.filter(b => hit(b, m, f));
const isRecent = b => month === latest && b.m[month] && b.m[month].last >= recentFrom;

// ---------- map ----------
const map = L.map("map", { zoomSnap: 0.25, scrollWheelZoom: false });
const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
// Esri's gray canvas needs no key, and keeps the dots the loudest thing on the map.
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark ? "World_Dark_Gray_Base" : "World_Light_Gray_Base"}/MapServer/tile/{z}/{y}/{x}`, {
  attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 16,
}).addTo(map);
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark ? "World_Dark_Gray_Reference" : "World_Light_Gray_Reference"}/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, pane: "overlayPane" }).addTo(map);
const toLatLngs = rings => (Array.isArray(rings[0][0][0]) ? rings : [rings]).map(poly => poly.map(r => r.map(([x, y]) => [y, x])));
const keyStyle = () => ({ color: css("--key-fill"), weight: 1, fillColor: css("--key-fill"), fillOpacity: 0.25 });
D.keys.forEach(k => {
  const g = k.geom, tip = `${k.name} <span style="color:var(--muted)">(${k.kind === "childcare" ? "child care" : k.kind})</span>`;
  const layer = g.type === "Point"
    ? L.circleMarker([g.coordinates[1], g.coordinates[0]], { ...keyStyle(), radius: 5 })
    : L.polygon(g.type === "Polygon" ? [g.coordinates.map(r => r.map(([x, y]) => [y, x]))] : g.coordinates.map(p => p.map(r => r.map(([x, y]) => [y, x]))), keyStyle());
  layer.bindTooltip(tip, { sticky: true, className: "tip" }).addTo(map);
});
const edge = L.polygon(toLatLngs(D.rings), { color: css("--edge"), weight: 2, dashArray: "6 5", fill: false, interactive: false }).addTo(map);
map.fitBounds(edge.getBounds(), { padding: [12, 12] });
const dots = L.layerGroup().addTo(map);
const markers = {};
const radius = n => 5 + Math.sqrt(n) * 2.6;

function drawMap() {
  dots.clearLayers();
  for (const k in markers) delete markers[k];
  // Biggest first, so small dots stay on top and clickable.
  activeIn(month).sort((a, b) => b.m[month].n - a.m[month].n).forEach(b => {
    const x = b.m[month], recent = isRecent(b);
    const mk = L.circleMarker([b.lat, b.lng], {
      radius: radius(x.n), color: b.near ? css("--ring") : css("--bg"), weight: b.near ? 2.5 : 2, opacity: 1,
      fillColor: recent ? css("--recent") : css("--earlier"), fillOpacity: 0.9,
    });
    mk.bindTooltip(`<b>${b.name}</b><br>${x.n} report${x.n > 1 ? "s" : ""} in ${monthName(month)}${b.near ? `<br>Near ${b.near}` : ""}`, { className: "tip", direction: "top", offset: [0, -radius(x.n)] });
    mk.on("click", () => select(b.name, true));
    mk.addTo(dots);
    markers[b.name] = mk;
  });
  const recentShown = month === latest;
  $("legend").innerHTML = [
    recentShown ? `<span><i class="dot" style="background:var(--recent)"></i>Reported in the last 7 days</span><span><i class="dot" style="background:var(--earlier)"></i>Earlier this month</span>`
                : `<span><i class="dot" style="background:var(--earlier)"></i>Reported in ${monthName(month)}</span>`,
    `<span>Bigger dot, more reports</span>`,
    `<span><i class="ringed"></i>Within about 300 feet of a school, park, library or child care</span>`,
    `<span><i class="keysw"></i>300 feet around schools, parks, libraries, child care</span>`,
    `<span><i class="edgesw"></i>${D.hood}</span>`,
  ].join("");
}

// ---------- headline ----------
function drawHero() {
  const n = activeIn(month).length, ago = `${+month.slice(0, 4) - 1}${month.slice(4)}`, then = D.months.includes(ago) ? activeIn(ago).length : null;
  const partial = month === latest ? ` so far (through ${dayName(D.cutoff)})` : "";
  $("heroNum").textContent = n;
  $("heroWhat").textContent = `block${n === 1 ? "" : "s"} in ${D.hood} had ${FILTER_WORDS[filter]} reported in ${monthName(month)}${partial}.`;
  $("heroThen").textContent = then == null ? "" : `${monthName(ago)}: ${then} block${then === 1 ? "" : "s"}${month === latest ? ", the whole month" : ""}.`;
}

// ---------- chart: one bar per month ----------
function drawChart() {
  const W = $("chart").clientWidth || 800, H = 180, pad = { l: 30, r: 4, t: 8, b: 22 };
  const vals = D.months.map(m => activeIn(m).length), max = Math.max(4, ...vals);
  const step = Math.ceil(max / 4 / 5) * 5 || 1, top = Math.ceil(max / step) * step;
  const bw = (W - pad.l - pad.r) / D.months.length, y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Blocks with a report each month">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${v}</text>`;
  D.months.forEach((m, i) => {
    const x = pad.l + i * bw, v = vals[i], h = y(0) - y(v), w = Math.max(2, bw - 2);
    // A bar's top corners are rounded and its bottom sits square on the baseline.
    const r = Math.min(4, w / 2, h);
    const path = v ? `M${x + 1},${y(0)} V${y(v) + r} Q${x + 1},${y(v)} ${x + 1 + r},${y(v)} H${x + 1 + w - r} Q${x + 1 + w},${y(v)} ${x + 1 + w},${y(v) + r} V${y(0)} Z` : "";
    s += `<path d="${path}" fill="var(${m === month ? "--bar-on" : "--bar"})"/>`;
    s += `<rect x="${x}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (m.endsWith("-01")) s += `<text x="${x + 1}" y="${H - 6}" font-size="11" fill="var(--faint)">${m.slice(0, 4)}</text>`;
  });
  s += `</svg><div class="tip" hidden></div>`;
  $("chart").innerHTML = s;
  const tip = $("chart").querySelector(".tip");
  $("chart").querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i, m = D.months[i];
    r.addEventListener("mousemove", e => {
      const box = $("chart").getBoundingClientRect(), reports = D.blocks.reduce((t, b) => t + (hit(b, m) ? b.m[m].n : 0), 0);
      tip.hidden = false;
      tip.innerHTML = `<b>${monthName(m)}</b><br>${vals[i]} block${vals[i] === 1 ? "" : "s"}, ${reports} report${reports === 1 ? "" : "s"}`;
      tip.style.left = Math.min(e.clientX - box.left + 12, box.width - tip.offsetWidth) + "px";
      tip.style.top = (e.clientY - box.top - 50) + "px";
    });
    r.addEventListener("mouseleave", () => { tip.hidden = true; });
    r.addEventListener("click", () => setMonth(m));
  });
}

// ---------- table and block panel ----------
function drawTable() {
  const list = activeIn(month).sort((a, b) => b.m[month].n - a.m[month].n || a.name.localeCompare(b.name));
  $("tableTitle").textContent = `Blocks with a report in ${monthName(month)}`;
  $("rows").innerHTML = list.map(b => { const x = b.m[month]; return `<tr data-b="${b.name}" class="${b.name === selected ? "sel" : ""}"><td>${b.name}</td><td class="n">${x.n}</td><td class="n">${x.tents}</td><td class="n">${x.rvs}</td><td class="n">${x.sidewalk}</td><td class="n">${x.needles}</td><td>${b.near || ""}</td><td>${dayName(x.last)}</td></tr>`; }).join("")
    || `<tr><td colspan="8">No blocks had ${FILTER_WORDS[filter]} reported this month.</td></tr>`;
  $("rows").querySelectorAll("tr[data-b]").forEach(tr => tr.addEventListener("click", () => select(tr.dataset.b, true)));
}

function drawPanel() {
  const b = D.blocks.find(x => x.name === selected);
  if (!b) {
    $("panel").innerHTML = `<h3>Pick a dot</h3><div class="sub">Each dot is a block where neighbors reported an encampment in ${monthName(month)}. Tap one to see its history and what you can do.</div>
      <dl><dt>Blocks</dt><dd>${activeIn(month).length}</dd><dt>Reports</dt><dd>${D.blocks.reduce((t, x) => t + (hit(x, month) ? x.m[month].n : 0), 0)}</dd></dl>`;
    return;
  }
  const x = b.m[month] || { n: 0, tents: 0, rvs: 0, sidewalk: 0, needles: 0 };
  const last12 = D.months.slice(-12), on = last12.filter(m => b.m[m]).length;
  const all = Object.values(b.m).reduce((t, v) => t + v.n, 0), first = Object.keys(b.m)[0];
  $("panel").innerHTML = `<h3>${b.name}</h3>
    <div class="sub">${b.near ? `Within about 300 feet of ${b.near}` : D.hood}</div>
    <dl>
      <dt>${monthName(month)}</dt><dd>${x.n} report${x.n === 1 ? "" : "s"}</dd>
      <dt>Tents</dt><dd>${x.tents}</dd><dt>RVs or cars</dt><dd>${x.rvs}</dd>
      <dt>Blocking sidewalk</dt><dd>${x.sidewalk}</dd><dt>Needles</dt><dd>${x.needles}</dd>
      <dt>Since ${monthName(first)}</dt><dd>${all} reports</dd>
    </dl>
    <div class="sub" style="margin:10px 0 2px">Months with a report, last 12: <b style="color:var(--fg)">${on} of 12</b></div>
    <div class="months12">${last12.map(m => `<span class="${b.m[m] ? "on" : ""}" title="${monthName(m)}${b.m[m] ? `: ${b.m[m].n} reports` : ": none"}"></span>`).join("")}</div>
    <div class="acts">
      <a class="primary" href="${FIND_IT}" target="_blank" rel="noopener">Report it in Find It, Fix It ↗</a>
      <button disabled title="Not built yet">Adopt this place (coming soon)</button>
      <button id="share">Share this block</button>
    </div>`;
  $("share").onclick = () => {
    const url = location.href.split("#")[0] + `#m=${month}&b=${slug(b.name)}`;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { $("share").textContent = "Link copied"; }, () => prompt("Copy this link", url));
  };
}

function select(name, pan) {
  selected = name;
  drawPanel(); drawTable();
  const mk = markers[name];
  if (mk && pan) { map.panTo(mk.getLatLng()); mk.openTooltip(); }
}
function setMonth(m) { month = m; $("month").value = m; draw(); }
function draw() { drawHero(); drawMap(); drawChart(); drawTable(); drawPanel(); }

// ---------- controls ----------
$("hoodname").textContent = D.hood;
$("month").innerHTML = D.months.slice().reverse().map(m => `<option value="${m}">${monthName(m)}${m === latest ? " (so far)" : ""}</option>`).join("");
$("month").onchange = e => setMonth(e.target.value);
$("filters").innerHTML = FILTERS.map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${k === filter}">${t}</button>`).join(" ");
$("filters").querySelectorAll(".chip").forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  $("filters").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  draw();
});
$("notes").innerHTML = [
  `A dot is a block where at least one neighbor reported an encampment to the city that month. It isn't proof a camp is there now, and camps nobody reports don't show up.`,
  `Dots sit in the middle of each block's reports, never at a report's exact spot, and the last ${(new Date(D.built) - new Date(D.cutoff)) / 864e5} days are left out.`,
  `${D.reports.toLocaleString()} reports since July 2022 from the City of Seattle's <a href="https://data.seattle.gov/d/k7ra-jqqe" target="_blank" rel="noopener">Unauthorized Encampment Reports</a> (Find It, Fix It, the city's web form and phone). July 2022 is when the current report form started; earlier reports are counted differently.`,
  `The shaded areas are the <a href="https://unsheltered.davepeck.org/safe-zones/" target="_blank" rel="noopener">safe zones from Unsheltered Seattle</a>: schools, parks, libraries and child care from OpenStreetMap, with 300 feet around each. A block is near one when its dot is inside. ${D.hood}'s boundary is Crosswalk Watch's, from the city's Neighborhood Map Atlas.`,
  `Built ${dayName(D.built)}, ${D.built.slice(0, 4)}, with data through ${dayName(D.cutoff)}.`,
].map(t => `<li>${t}</li>`).join("");

// Links like #m=2026-09&b=4500-block-of-whitman-ave-n open that month and block.
function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("m") && D.months.includes(h.get("m"))) month = h.get("m");
  $("month").value = month;
  draw();
  const b = h.get("b") && D.blocks.find(x => slug(x.name) === h.get("b"));
  if (b) select(b.name, true);
}
fromHash();
addEventListener("hashchange", fromHash);
addEventListener("resize", drawChart);
</script>
</body>
</html>
